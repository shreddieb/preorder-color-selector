
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Select Colors</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .item { margin-bottom: 20px; padding:10px; border:1px solid #ddd; }
  </style>
</head>
<body>
<h2>Select Colors for Your Pre‑Order Items</h2>
<div id="items"></div>
<button id="saveBtn">Save</button>

<script>
const params = new URLSearchParams(window.location.search);
const order = params.get("order");
const email = params.get("email");

async function loadItems() {
  const res = await fetch(`/api/order-info?order=${order}&email=${email}`);
  const data = await res.json();
  const container = document.getElementById("items");

  data.items.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <strong>${item.title}</strong><br>
      Qty: ${item.quantity}<br>
      <label>Color:
        <select data-line-id="${item.id}">
          <option>Cobblestone</option>
          <option>Navy</option>
          <option>Lime</option>
          <option>Plum</option>
          <option>Mocha</option>
          <option>Pink</option>
          <option>Petal</option>
          <option>Lemon</option>
        </select>
      </label>
    `;
    container.appendChild(div);
  });
}

document.getElementById("saveBtn").onclick = async () => {
  const selects = document.querySelectorAll("select");
  const payload = [];
  selects.forEach(s => {
    payload.push({ line_id: s.dataset.lineId, color: s.value });
  });

  await fetch("/api/save-colors", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ order, email, selections: payload })
  });

  alert("Saved!");
};

loadItems();
</script>
</body>
</html>
